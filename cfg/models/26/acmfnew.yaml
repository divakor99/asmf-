# YOLO26-seg + ACMF (cross-scale fusion), no P2 branch.
# Layers 16/19/22 are P3(8)/P4(16)/P5(32). ACMF takes widths [256, 512, 512] and returns
# a pyramid with the SAME widths; the Segment26 head reads [256, 512, 512] (needs patched parse_model).

nc: 6             # allig, block, long, manhole, patch, trans (data.yaml overrides)
end2end: True
reg_max: 16       # set to 1 ONLY if you init from a reg_max=1 checkpoint (see notes)

scales:
  l: [1.00, 1.00, 512]
scale: l

backbone:
  - [-1, 1, Conv, [64, 3, 2]]              # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]             # 1  P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]      # 2
  - [-1, 1, Conv, [256, 3, 2]]             # 3  P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]      # 4
  - [-1, 1, Conv, [512, 3, 2]]             # 5  P4/16
  - [-1, 2, C3k2, [512, True]]             # 6
  - [-1, 1, Conv, [1024, 3, 2]]            # 7  P5/32 (capped to 512 by max_channels)
  - [-1, 2, C3k2, [1024, True]]            # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]]      # 9
  - [-1, 2, C2PSA, [1024]]                 # 10

head:
  # ---- top-down FPN ----
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11
  - [[-1, 6], 1, Concat, [1]]                    # 12
  - [-1, 2, C3k2, [512, True]]                   # 13  P4 td

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14
  - [[-1, 4], 1, Concat, [1]]                    # 15
  - [-1, 2, C3k2, [256, True]]                   # 16  P3 td      -> ACMF in 0

  # ---- bottom-up PAN ----
  - [-1, 1, Conv, [256, 3, 2]]                   # 17
  - [[-1, 13], 1, Concat, [1]]                   # 18
  - [-1, 2, C3k2, [512, True]]                   # 19  P4 out     -> ACMF in 1

  - [-1, 1, Conv, [512, 3, 2]]                   # 20
  - [[-1, 10], 1, Concat, [1]]                   # 21
  - [-1, 1, C3k2, [1024, True, 0.5, True]]       # 22  P5 out     -> ACMF in 2

  # ---- ACMF: cross-scale fusion, returns [P3', P4', P5'] ----
  - [[16, 19, 22], 1, ACMF, []]                  # 23

  # ---- segmentation head consumes the ACMF list ----
  - [23, 1, Segment26, [nc, 32, 256]]            # 24
