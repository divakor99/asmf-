# YOLO26-seg + ACMF-Head, no P2 branch, no P3 refinement.
# Verified against Proto26: layers 16/19/22 are P3(8)/P4(16)/P5(32).
# Required code changes: ACMF class in block.py, import in tasks.py, parse_model branches.

nc: 80 # ← CHANGE to your actual number of classes
end2end: True
reg_max: 16 # ← was 1

scales:
  #  n: [0.50, 0.25, 1024]
  #  s: [0.50, 0.50, 1024]
  #  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
#  x: [1.00, 1.50, 512]
scale: l

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1  P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3  P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5  P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7  P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  # ---- top-down FPN ----
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11  P5 -> P4 res
  - [[-1, 6], 1, Concat, [1]] # 12  cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13  P4 td (stride 16)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14  P4 -> P3 res
  - [[-1, 4], 1, Concat, [1]] # 15  cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 16  P3 td (stride 8)  ← ACMF input 0

  # ---- bottom-up PAN ----
  - [-1, 1, Conv, [256, 3, 2]] # 17  P3 -> P4 (stride 16)
  - [[-1, 13], 1, Concat, [1]] # 18  cat P4 td (layer 13)
  - [-1, 2, C3k2, [512, True]] # 19  P4 out (stride 16) ← ACMF input 1

  - [-1, 1, Conv, [512, 3, 2]] # 20  P4 -> P5 (stride 32)
  - [[-1, 10], 1, Concat, [1]] # 21  cat backbone P5 (layer 10)
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 22  P5 out (stride 32) ← ACMF input 2

  # ---- ACMF-Head: refines (P3, P4, P5) with cross-scale channel attention ----
  - [[16, 19, 22], 1, ACMF, []] # 23  returns [P3', P4', P5']

  # ---- segmentation head consumes the ACMF list ----
  - [23, 1, Segment26, [nc, 32, 256]] # 24
